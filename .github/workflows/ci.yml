name: Java build and tests
on:
  push:
    branches: [master, 'improve/**']
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit and integration tests
        run: ./mvnw -B verify
