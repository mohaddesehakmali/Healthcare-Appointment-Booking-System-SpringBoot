name: Java build and tests
on:
  push:
    branches: [master, 'improve/**']
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit and integration tests
        run: bash ./mvnw -B verify
